meta:
  version: "1.0"

# Each session is a separate client connection. Many separate connections, with
# a single keep-alive origin host, let ATS pool the origin session globally and
# reuse it from whichever ET_NET thread the next connection lands on -- which is
# usually a different thread, exercising cross-thread migration.
sessions:
- protocol:
  - name: tls
    sni: example.com
  - name: tcp
  - name: ip
  transactions:
  - client-request:
      method: GET
      url: /
      version: "1.1"
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, "1" ]
    proxy-response:
      status: 200
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, "10" ]
