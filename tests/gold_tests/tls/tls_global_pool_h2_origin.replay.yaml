meta:
  version: "1.0"

# Each session is a separate HTTP/2 client connection to ATS. The origin speaks
# HTTP/2 over TLS (the server-response version is 2). Many separate client
# connections to a single keep-alive origin host let ATS pool the origin
# session. Even with the global pool configured, HTTP/2 origin sessions are
# pooled per-thread, so they are reused on their own thread and never take the
# cross-thread migration path.
sessions:
- protocol:
    stack: http2
    tls:
      sni: example.com
  transactions:
  - client-request:
      headers:
        fields:
        - [ :method, GET ]
        - [ :scheme, https ]
        - [ :authority, example.com ]
        - [ :path, / ]
        - [ uuid, "1" ]
    proxy-response:
      status: 200
    server-response:
      version: "2"
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, "10" ]
